name: Update contribution calendar

on:
  schedule:
    - cron: '17 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install calendar renderer
        run: npm ci --ignore-scripts --prefix .github/heatmap
      - name: Generate calendar
        run: node .github/heatmap/generate.mjs
        env:
          GH_TOKEN: ${{ secrets.CONTRIBUTIONS_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
      - name: Commit calendar
        run: |
          git add assets/contributions-light.svg assets/contributions-dark.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update contribution calendar'
          git push
